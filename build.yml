name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unzip project (if you uploaded AkulaClaudeX.zip)
        run: |
          if [ -f AkulaClaudeX.zip ]; then unzip -q -o AkulaClaudeX.zip -d project; fi

      - name: Build debug APK
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          DIR=$(dirname "$SETTINGS")
          echo "Building in $DIR"
          cd "$DIR"
          gradle assembleDebug --no-daemon
          echo "APK_DIR=$PWD" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: AkulaClaudeX-apk
          path: ${{ env.APK_DIR }}/app/build/outputs/apk/debug/*.apk
